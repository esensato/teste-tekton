apiVersion: tekton.dev/v1
kind: Task
metadata:
  name: mensagem-boas-vindas
spec:
  steps:
    - name: mensagem
      image: alpine:3.20
      script: |
        #!/bin/sh
        echo "Bem vindo ao tekton"

---
apiVersion: tekton.dev/v1
kind: Pipeline
metadata:
  name: pipeline-boas-vindas
spec:
  tasks:
    - name: boas-vindas
      taskRef:
        name: mensagem-boas-vindas

---
apiVersion: triggers.tekton.dev/v1beta1
kind: Trigger
metadata:
  name: trigger-boas-vindas
spec:
  bindings: []
  template:
    spec:
      pipelineRun:
        metadata:
          generateName: pipeline-boas-vindas-run-
        spec:
          pipelineRef:
            name: pipeline-boas-vindas

---
apiVersion: triggers.tekton.dev/v1beta1
kind: EventListener
metadata:
  name: listener-boas-vindas
spec:
  triggers:
    - triggerRef: trigger-boas-vindas