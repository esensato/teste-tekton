# ============================================================
# TASK
# ============================================================
apiVersion: tekton.dev/v1
kind: Task
metadata:
  name: build-and-push-icr
spec:
  params:
    - name: IMAGE
      type: string
      description: Nome completo da imagem no IBM Container Registry

  workspaces:
    - name: source

  steps:
    - name: build-and-push
      image: gcr.io/kaniko-project/executor:v1.23.2
      env:
        - name: DOCKER_CONFIG
          value: /tekton/home/.docker
      script: |
        #!/busybox/sh

        set -e

        echo "========================================"
        echo "Build da imagem"
        echo "========================================"

        echo "Imagem:"
        echo "$(params.IMAGE)"

        echo "Contexto:"
        echo "$(workspaces.source.path)"

        echo "Dockerfile:"
        echo "$(workspaces.source.path)/Dockerfile"

        /kaniko/executor \
          --dockerfile="$(workspaces.source.path)/Dockerfile" \
          --context="$(workspaces.source.path)" \
          --destination="$(params.IMAGE)" \
          --cache=true

---
# ============================================================
# PIPELINE
# ============================================================
apiVersion: tekton.dev/v1
kind: Pipeline
metadata:
  name: build-and-push
spec:
  params:
    - name: IMAGE
      type: string
      description: Imagem a ser publicada
      default: br.icr.io/meu-namespace/meu-app:latest

  workspaces:
    - name: source

  tasks:
    - name: build-and-push
      taskRef:
        name: build-and-push-icr

      params:
        - name: IMAGE
          value: "$(params.IMAGE)"

      workspaces:
        - name: source
          workspace: source

---
# ============================================================
# TRIGGER BINDING
# ============================================================
apiVersion: triggers.tekton.dev/v1beta1
kind: TriggerBinding
metadata:
  name: build-and-push-binding
spec:
  params:
    - name: IMAGE
      value: "br.icr.io/meu-namespace/meu-app:latest"

---
# ============================================================
# TRIGGER TEMPLATE
# ============================================================
apiVersion: triggers.tekton.dev/v1beta1
kind: TriggerTemplate
metadata:
  name: build-and-push-template
spec:
  params:
    - name: IMAGE
      default: br.icr.io/meu-namespace/meu-app:latest

  resourcetemplates:
    - apiVersion: tekton.dev/v1
      kind: PipelineRun

      metadata:
        generateName: build-and-push-

      spec:
        pipelineRef:
          name: build-and-push

        params:
          - name: IMAGE
            value: "$(tt.params.IMAGE)"

        workspaces:
          - name: source
            emptyDir: {}

---
# ============================================================
# EVENT LISTENER
# ============================================================
apiVersion: triggers.tekton.dev/v1beta1
kind: EventListener
metadata:
  name: listener-build-and-push
spec:
  triggers:
    - name: trigger-build-and-push

      bindings:
        - ref: build-and-push-binding

      template:
        ref: build-and-push-template