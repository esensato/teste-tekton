apiVersion: tekton.dev/v1
kind: Task
metadata:
  name: build-and-push-icr
spec:
  params:
    - name: IMAGE
      type: string
      default: br.icr.io/meu-namespace/meu-app:latest

    - name: GIT_REPOSITORY
      type: string

    - name: GIT_REVISION
      type: string
      default: main

  workspaces:
    - name: source

  steps:

    # ========================================================
    # 1. Clone do GitHub
    # ========================================================
    - name: git-clone
      image: alpine/git:2.45.2
      command:
        - git
      args:
        - clone
        - --branch
        - "$(params.GIT_REVISION)"
        - "$(params.GIT_REPOSITORY)"
        - "$(workspaces.source.path)"

    # ========================================================
    # 2. Build + Push
    # ========================================================
    - name: build-and-push
      image: gcr.io/kaniko-project/executor:v1.23.2
      command:
        - /kaniko/executor
      args:
        - --dockerfile=$(workspaces.source.path)/Dockerfile
        - --context=$(workspaces.source.path)
        - --destination=$(params.IMAGE)
        - --cache=true

---
apiVersion: tekton.dev/v1
kind: Pipeline
metadata:
  name: build-and-push
spec:
  params:

    - name: IMAGE
      type: string
      default: br.icr.io/meu-namespace/meu-app:latest

    - name: GIT_REPOSITORY
      type: string

    - name: GIT_REVISION
      type: string
      default: main

  workspaces:
    - name: source

  tasks:

    - name: build-and-push
      taskRef:
        name: build-and-push-icr

      params:

        - name: IMAGE
          value: "$(params.IMAGE)"

        - name: GIT_REPOSITORY
          value: "$(params.GIT_REPOSITORY)"

        - name: GIT_REVISION
          value: "$(params.GIT_REVISION)"

      workspaces:

        - name: source
          workspace: source

---
apiVersion: triggers.tekton.dev/v1beta1
kind: TriggerBinding
metadata:
  name: build-and-push-binding
spec:
  params:

    - name: IMAGE
      value: br.icr.io/meu-namespace/meu-app:latest

    - name: GIT_REPOSITORY
      value: https://github.com/minha-org/meu-app.git

    - name: GIT_REVISION
      value: main

---
apiVersion: triggers.tekton.dev/v1beta1
kind: TriggerTemplate
metadata:
  name: build-and-push-template
spec:
  params:

    - name: IMAGE
      default: br.icr.io/meu-namespace/meu-app:latest

    - name: GIT_REPOSITORY

    - name: GIT_REVISION
      default: main

  resourcetemplates:

    - apiVersion: tekton.dev/v1
      kind: PipelineRun

      metadata:
        generateName: build-and-push-

      spec:

        pipelineRef:
          name: build-and-push

        params:

          - name: IMAGE
            value: "$(tt.params.IMAGE)"

          - name: GIT_REPOSITORY
            value: "$(tt.params.GIT_REPOSITORY)"

          - name: GIT_REVISION
            value: "$(tt.params.GIT_REVISION)"

        workspaces:

          - name: source
            emptyDir: {}

---
apiVersion: triggers.tekton.dev/v1beta1
kind: EventListener
metadata:
  name: listener-build-and-push
spec:
  triggers:

    - name: trigger-build-and-push

      bindings:
        - ref: build-and-push-binding

      template:
        ref: build-and-push-template